modules:
  jira:issuePanel:
    - key: decision-recall-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Decision Recall
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  rovo:agent:
    - key: decision-recall-agent
      name: Decision Recall
      description: Finds past decisions, related work and owners for a Jira issue
        before the team re-decides it.
      prompt: >
        You are Decision Recall. When a user names a Jira issue key, call the
        recall-context action with that key. Reply with: 1) decisions already
        made that touch this work (Confluence pages, with links), 2) related
        issues and their status, 3) who owned them. Never invent a decision; if
        none is found, say so and suggest recording one.
      conversationStarters:
        - What has already been decided about this issue?
        - Who worked on something like this before?
      actions:
        - recall-context
  action:
    - key: recall-context
      name: Recall context for an issue
      function: recall
      actionVerb: GET
      description: Returns past decisions (Confluence), related Jira issues and their
        owners for an issue key.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, like PROJ-12
  function:
    - key: resolver
      handler: index.handler
    - key: recall
      handler: index.recallAction
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5a5078c5-3827-445d-9ef3-1f75bdbcc80b
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:confluence-content.summary
    - search:confluence
